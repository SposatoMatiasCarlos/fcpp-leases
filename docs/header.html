})();
</script>

    <td id="fl-controls-cell">
     <div class="fl-controls">
      <span class="fl-lang"><a id="fl-lang-it" href="#">IT</a><a id="fl-lang-en" href="#">EN</a></span>
      <button id="fl-theme" type="button" class="fl-theme"><svg class="fl-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg><svg class="fl-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
     </div>
     <script type="text/javascript">
     (function() {
         // the two languages are built side by side: .../html/it/<page> and .../html/en/<page>
         var url = location.href;
         var at = Math.max(url.lastIndexOf('/it/'), url.lastIndexOf('/en/'));
         var lang = at >= 0 ? url.substr(at + 1, 2) : 'it';
         ['it', 'en'].forEach(function(l) {
             var a = document.getElementById('fl-lang-' + l);
             a.href = at >= 0 ? url.substr(0, at + 1) + l + url.substr(at + 3) : url;
             if (l === lang) a.className = 'current';
             a.addEventListener('click', function() {
                 try { localStorage.setItem('fcpp-leases-lang', l); } catch (e) {}
             });
         });
         var button = document.getElementById('fl-theme');
         var label = lang === 'it' ? 'Tema chiaro o scuro' : 'Light or dark theme';
         button.title = label;
         button.setAttribute('aria-label', label);
         button.addEventListener('click', function() {
             var root = document.documentElement;
             var dark = !root.classList.contains('dark-mode');
             root.classList.toggle('dark-mode', dark);
             root.classList.toggle('light-mode', !dark);
             try { localStorage.setItem('fcpp-leases-theme', dark ? 'dark' : 'light'); } catch (e) {}
         });
     })();
     </script>
