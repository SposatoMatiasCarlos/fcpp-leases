<!DOCTYPE html>
<!-- Entry point copied to build/html/index.html by build.sh: opens the language chosen last (English by default). -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>fcpp-leases</title>
<script>
var lang = 'en';
try { lang = localStorage.getItem('fcpp-leases-lang') === 'it' ? 'it' : 'en'; } catch (e) {}
location.replace(lang + '/index.html');
</script>
<meta http-equiv="refresh" content="1; url=en/index.html"/>
</head>
<body><p><a href="en/index.html">English</a> · <a href="it/index.html">Italiano</a></p></body>
</html>
